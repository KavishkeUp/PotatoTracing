# Azure DevOps Pipeline for Potato Traceability System
trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'Azure-Service-Connection'
  webAppName: 'potato-traceability-backend'
  staticWebAppName: 'potato-traceability-frontend'
  containerRegistry: 'potatotraceability.azurecr.io'
  imageRepository: 'potato-traceability'
  dockerfilePath: '$(Build.SourcesDirectory)/Backend/Dockerfile'
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'
      displayName: 'Install Node.js'

    - task: Npm@1
      inputs:
        command: 'ci'
        workingDir: '$(Build.SourcesDirectory)/Backend'
      displayName: 'Install backend dependencies'

    - task: Npm@1
      inputs:
        command: 'ci'
        workingDir: '$(Build.SourcesDirectory)/Frontend'
      displayName: 'Install frontend dependencies'

    - task: Npm@1
      inputs:
        command: 'run build'
        workingDir: '$(Build.SourcesDirectory)/Frontend'
      displayName: 'Build frontend'

    - task: Docker@2
      displayName: Build and push backend image
      inputs:
        command: buildAndPush
        repository: '$(imageRepository)-backend'
        dockerfile: '$(dockerfilePath)'
        containerRegistry: '$(azureServiceConnection)'
        tags: |
          $(tag)
          latest

    - task: Docker@2
      displayName: Build and push frontend image
      inputs:
        command: buildAndPush
        repository: '$(imageRepository)-frontend'
        dockerfile: '$(Build.SourcesDirectory)/Frontend/Dockerfile'
        containerRegistry: '$(azureServiceConnection)'
        tags: |
          $(tag)
          latest

- stage: Deploy
  displayName: Deploy stage
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployBackend
    displayName: Deploy Backend
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: 'Deploy Backend to Azure Web App'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appName: '$(webAppName)'
              containers: '$(containerRegistry)/$(imageRepository)-backend:$(tag)'

  - deployment: DeployFrontend
    displayName: Deploy Frontend
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureStaticWebApp@0
            displayName: 'Deploy Frontend to Azure Static Web App'
            inputs:
              azure_subscription: '$(azureServiceConnection)'
              app_location: '$(Build.SourcesDirectory)/Frontend'
              api_location: ''
              output_location: 'build'
